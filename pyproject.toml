[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK + FastAPI)"
readme = "README.md"
authors = [
    { name = "gquadros", email = "gquadross@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.9.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
aurora-api = "aurora.main:run"
aurora-reset = "aurora.infra.seed:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aurora"
